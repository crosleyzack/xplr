name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25

      - name: Sync flake.nix version to tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/version = \"[0-9][0-9.]*\";/version = \"$VERSION\";/" flake.nix
          grep -n 'version = ' flake.nix

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
