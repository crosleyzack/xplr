name: Go Test

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  go-fmt:
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: gofmt
        run: |
          OUTPUT=$(gofmt -l -s .)
          if [ -n "$OUTPUT" ]; then
            echo "The following files are not formatted correctly:"
            echo "$OUTPUT"
            exit 1
          fi

  go-tests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
